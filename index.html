<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: "Hiragino Maru Gothic ProN", "Maru Gothic", "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      background-color: #fbf8f3;
      /* 全体の文字：マイルドなクリーム色 ＋ 深いテラコッタオレンジのフチ(1px) */
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #e65c00, 1px -1px 0 #e65c00,
        -1px 1px 0 #e65c00, -1px -1px 0 #e65c00,
        1px 0px 0 #e65c00, -1px 0px 0 #e65c00,
        0px 1px 0 #e65c00, 0px -1px 0 #e65c00;
      box-sizing: border-box;
      min-height: 100vh;
    }

    header {
      background: #e65c00;
      /* ヘッダー：オレンジ背景に映える クリーム文字 ＋ 完熟トマトレッドのフチ(1px) */
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #d9381e, 1px -1px 0 #d9381e,
        -1px 1px 0 #d9381e, -1px -1px 0 #d9381e,
        1px 0px 0 #d9381e, -1px 0px 0 #d9381e,
        0px 1px 0 #d9381e, 0px -1px 0 #d9381e;
      padding: 16px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(230, 92, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .controls {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding: 12px;
      justify-content: center;
      background: #fbf8f3;
    }

    .controls::-webkit-scrollbar {
      display: none;
    }

    button {
      margin: 5px;
      padding: 10px 16px;
      cursor: pointer;
      border: 1px solid #f0d8c0;
      background: white;
      border-radius: 999px;
      font-weight: bold;
      transition: 0.2s;
      box-shadow: 0 2px 5px rgba(230, 92, 0, 0.08);
      white-space: nowrap;
      /* ボタンの文字：クリーム文字 ＋ テラコッタオレンジのフチ(1px) */
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #e65c00, 1px -1px 0 #e65c00,
        -1px 1px 0 #e65c00, -1px -1px 0 #e65c00,
        1px 0px 0 #e65c00, -1px 0px 0 #e65c00,
        0px 1px 0 #e65c00, 0px -1px 0 #e65c00;
    }

    button:hover {
      background: #fff3e6;
    }

    button.active {
      background: #d9381e;
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #e65c00, 1px -1px 0 #e65c00,
        -1px 1px 0 #e65c00, -1px -1px 0 #e65c00,
        1px 0px 0 #e65c00, -1px 0px 0 #e65c00,
        0px 1px 0 #e65c00, 0px -1px 0 #e65c00;
    }

    .section-label {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #e65c00, 1px -1px 0 #e65c00,
        -1px 1px 0 #e65c00, -1px -1px 0 #e65c00,
        1px 0px 0 #e65c00, -1px 0px 0 #e65c00,
        0px 1px 0 #e65c00, 0px -1px 0 #e65c00;
    }

    /* メニュータイプ */
    #menuTypeButtons {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding: 12px;
      background: white;
      position: sticky;
      top: 72px;
      z-index: 998;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
    }

    #menuTypeButtons::-webkit-scrollbar {
      display: none;
    }

    /* カテゴリ */
    .category-nav {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding: 12px;
      background: #fff9f2;
      position: sticky;
      top: 140px;
      z-index: 997;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .category-nav::-webkit-scrollbar {
      display: none;
    }

    #menu {
      padding: 16px;
    }

    h2 {
      margin-top: 40px;
      border-left: 6px solid #557a2b;
      padding-left: 10px;
      font-size: 26px;
      /* 見出し：クリーム文字 ＋ 深みのあるトマトレッドのフチ(1px) */
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #d9381e, 1px -1px 0 #d9381e,
        -1px 1px 0 #d9381e, -1px -1px 0 #d9381e,
        1px 0px 0 #d9381e, -1px 0px 0 #d9381e,
        0px 1px 0 #d9381e, 0px -1px 0 #d9381e;
    }

    .menu-item {
      background: white;
      margin-bottom: 12px;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(230, 92, 0, 0.04);
      border: 1px solid #fff3e6;
    }

    .name {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: bold;
      font-size: 18px;
      /* 料理名：クリーム文字 ＋ 料理を引き締めるダークブラウンのフチ(1px) */
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #943b00, 1px -1px 0 #943b00,
        -1px 1px 0 #943b00, -1px -1px 0 #943b00,
        1px 0px 0 #943b00, -1px 0px 0 #943b00,
        0px 1px 0 #943b00, 0px -1px 0 #943b00;
    }

    .price {
      white-space: nowrap;
      /* 価格：際立つ クリーム文字 ＋ トマトレッドのフチ(1px) */
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #d9381e, 1px -1px 0 #d9381e,
        -1px 1px 0 #d9381e, -1px -1px 0 #d9381e,
        1px 0px 0 #d9381e, -1px 0px 0 #d9381e,
        0px 1px 0 #d9381e, 0px -1px 0 #d9381e;
    }

    @media (max-width: 600px) {

      .name {
        font-size: 16px;
      }

      h2 {
        font-size: 22px;
      }

      header {
        font-size: 24px;
      }
    }

    .cocktail-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .cocktail-group {
      background: white;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(230, 92, 0, 0.04);
      border: 1px solid #fff3e6;
    }

    .cocktail-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 2px solid #e65c00;
      padding-bottom: 6px;
      /* カクテル見出し：クリーム文字 ＋ カクテル画像の枠を意識した鮮やかなイタリアングリーンのフチ(1px) */
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #00b050, 1px -1px 0 #00b050,
        -1px 1px 0 #00b050, -1px -1px 0 #00b050,
        1px 0px 0 #00b050, -1px 0px 0 #00b050,
        0px 1px 0 #00b050, 0px -1px 0 #00b050;
    }

    .cocktail-item {
      padding: 6px 0;
      border-bottom: 1px solid #fff3e6;
      /* 各カクテルメニュー名：クリーム文字 ＋ 深いブラウンのフチ(1px) */
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #943b00, 1px -1px 0 #943b00,
        -1px 1px 0 #943b00, -1px -1px 0 #943b00,
        1px 0px 0 #943b00, -1px 0px 0 #943b00,
        0px 1px 0 #943b00, 0px -1px 0 #943b00;
    }

    /* ==========================================================================
   追加・修正：デバイスサイズに合わせたレスポンシブ設定
   ========================================================================== */

    /* 全体のコンテナとしての基本設定（PC・タブレットで横に広がりすぎないように制限） */
    body {
      max-width: 1200px;
      /* PC版での全体の最大横幅 */
      margin: 0 auto;
      /* 画面中央に配置 */
      box-sizing: border-box;
    }

    /* 固定ヘッダーやボタンエリアもbodyの最大幅に合わせる */
    header,
    .controls,
    .category-nav,
    #menuTypeButtons {
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 通常のメニュー項目（サラダやパスタなど）のレイアウト設定 */
    #menu {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr;
      /* デフォルト（スマホ）は1列 */
      gap: 20px;
    }

    /* カテゴリごとのブロック（h2とメニューリストをまとめる調整用） */
    .category-block {
      break-inside: avoid;
    }

    /* メニューアイテムをパッと並べるためのコンテナ */
    .menu-items-container {
      display: grid;
      grid-template-columns: 1fr;
      /* デフォルト（スマホ）は1列 */
      gap: 12px;
    }

    /* ==========================================================================
   メディアクエリ：タブレット版（画面幅 601px 〜 1024px）
   ========================================================================== */
    @media (min-width: 601px) and (max-width: 1024px) {
      h2 {
        font-size: 24px;
      }

      .name {
        font-size: 17px;
      }

      /* 通常メニューを2列にする */
      .menu-items-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* ==========================================================================
   メディアクエリ：PC版（画面幅 1025px 以上）
   ========================================================================== */
    @media (min-width: 1025px) {
      header {
        font-size: 36px;
        padding: 24px;
      }

      h2 {
        font-size: 28px;
      }

      .name {
        font-size: 19px;
      }

      /* 通常メニューを3列にする（すっきり見せたい場合は2列でもOK） */
      .menu-items-container {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* ==========================================================================
   既存のスマホ版設定（max-width: 600px）の微調整
   ========================================================================== */
    @media (max-width: 600px) {
      .name {
        font-size: 16px;
      }

      h2 {
        font-size: 22px;
      }

      header {
        font-size: 24px;
      }

      /* スマホは1列のまま */
      .menu-items-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    let currentLanguage = "en";
    let currentMenuType = "dinner";

    function slugify(text) {

      return text
        .toLowerCase()
        .replace(/\s+/g, "-")
        .replace(/[^a-z0-9\-]/g, "");
    }

    function scrollToCategory(id) {

      const element = document.getElementById(id);

      if (element) {

        element.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    }

    function renderMenuTypeButtons() {

      const wrap =
        document.getElementById("menuTypeButtons");

      wrap.innerHTML = "";

      const menuTypes =
        data[currentLanguage].menuTypes;

      Object.keys(menuTypes).forEach(key => {

        const btn = document.createElement("button");

        btn.textContent = menuTypes[key].label;

        if (key === currentMenuType) {
          btn.classList.add("active");
        }

        btn.onclick = () => {

          currentMenuType = key;

          render();
        };

        wrap.appendChild(btn);
      });
    }

    function renderCategoryButtons(categories) {

      const wrap =
        document.getElementById("categoryButtons");

      wrap.innerHTML = "";

      categories.forEach((category, index) => {

        const btn = document.createElement("button");

        const id = slugify(category.name);

        btn.textContent = category.name;

        if (index === 0) {
          btn.classList.add("active");
        }

        btn.onclick = () => {

          document
            .querySelectorAll(".category-nav button")
            .forEach(b => b.classList.remove("active"));

          btn.classList.add("active");

          scrollToCategory(id);
        };

        wrap.appendChild(btn);
      });
    }

    function renderMenu() {

      const menuDiv =
        document.getElementById("menu");

      menuDiv.innerHTML = "";

      const currentData =
        data[currentLanguage];

      const categories =
        currentData.menuTypes[currentMenuType]
          .categories;

      renderCategoryButtons(categories);

      categories.forEach(category => {

        const categoryTitle =
          document.createElement("h2");

        categoryTitle.textContent =
          category.name;

        categoryTitle.id =
          slugify(category.name);

        menuDiv.appendChild(categoryTitle);

        const isCocktailCategory =
          category.name === "Cocktail(All 682yen)" ||
          category.name === "Cócteles (Todos ¥682)" ||
          category.name === "鸡尾酒（全部 ¥682)";

        // カクテル専用表示
        if (isCocktailCategory) {

          const wrapper =
            document.createElement("div");

          wrapper.className =
            "cocktail-wrapper";

          let currentGroup = null;

          category.items.forEach(item => {

            if (!item.name.startsWith("-")) {

              currentGroup =
                document.createElement("div");

              currentGroup.className =
                "cocktail-group";

              currentGroup.innerHTML = `
          <div class="cocktail-title">
            ${item.name.replace(/\n/g, "<br>")}
          </div>
        `;

              wrapper.appendChild(currentGroup);

            }

            else {

              const div =
                document.createElement("div");

              div.className =
                "cocktail-item";

              div.innerHTML =
                item.name
                  .replace("-", "")
                  .replace(/\n/g, "<br>");

              currentGroup.appendChild(div);
            }

          });

          menuDiv.appendChild(wrapper);

        }

        // 通常メニュー
        else {
          // メニューアイテムたちを包むコンテナを作る（ここでCSSの列数が適用されます）
          const itemsContainer = document.createElement("div");
          itemsContainer.className = "menu-items-container";

          category.items.forEach(item => {
            const div = document.createElement("div");
            div.className = "menu-item";
            div.innerHTML = `
              <div class="name">
                <span>${item.name.replace(/\n/g, "<br>")}</span>
                <span class="price">
                  ${item.price || ""}
                </span>
              </div>
            `;
            itemsContainer.appendChild(div);
          });

          menuDiv.appendChild(itemsContainer);
        }

      });

      menuDiv.appendChild(wrapper);

      return;
    }
    category.items.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "menu-item";

      div.innerHTML = `
        <div class="name">
          <span>${item.name}</span>
          <span class="price">${item.price}</span>
        </div>
      `;

      menuDiv.appendChild(div);
    });

    function updateLanguageButtons() {

      const buttons =
        document.querySelectorAll(
          "#languageButtons button"
        );

      buttons.forEach(btn =>
        btn.classList.remove("active")
      );

      buttons.forEach(btn => {

        if (
          (currentLanguage === "en" &&
            btn.textContent === "English") ||

          (currentLanguage === "es" &&
            btn.textContent === "Spanish") ||

          (currentLanguage === "zh" &&
            btn.textContent === "中文")
        ) {

          btn.classList.add("active");
        }

      });
    }

    function setLanguage(lang) {

      currentLanguage = lang;

      document.getElementById("title")
        .textContent = data[lang].title;

      document.getElementById("menuTypeLabel")
        .textContent =
        data[lang].menuTypeLabel;

      updateLanguageButtons();

      render();
    }

    function render() {

      renderMenuTypeButtons();

      renderMenu();
    }

    setLanguage("en");

  </script>

</body>

</html>
