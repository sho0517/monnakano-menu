<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --mobile-header-height: 64px;
      --mobile-navigation-height: 136px;
    }

    /* ==========================================================================
       1. 基本・土台の設定
       ========================================================================== */
    html {
      background-color: #3e2716;
      /* 画面最外縁の深みのある茶色 */
    }

    body {
      font-family: "Hiragino Maru Gothic ProN", "Maru Gothic", "Helvetica Neue", Arial, sans-serif;
      margin: 0 auto;
      padding: 0;
      box-sizing: border-box;
      background-color: #fbf8f3;
      /* メニュー背景のクリーム色 */
      max-width: 1200px;
      min-height: 100vh;
      border-left: 2px solid #e65c00;
      border-right: 2px solid #e65c00;
    }

    /* ==========================================================================
       2. 各パーツの共通スタイル
       ========================================================================== */
    header {
      background: #e65c00;
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #d9381e, 1px -1px 0 #d9381e,
        -1px 1px 0 #d9381e, -1px -1px 0 #d9381e,
        1px 0px 0 #d9381e, -1px 0px 0 #d9381e,
        0px 1px 0 #d9381e, 0px -1px 0 #d9381e;
      padding: 16px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(230, 92, 0, 0.15);
    }

    .section-label {
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 5px;
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #e65c00, 1px -1px 0 #e65c00,
        -1px 1px 0 #e65c00, -1px -1px 0 #e65c00,
        1px 0px 0 #e65c00, -1px 0px 0 #e65c00,
        0px 1px 0 #e65c00, 0px -1px 0 #e65c00;
    }

    /* ★横並びにするためのコンテナ設定 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      /* はみ出る場合は折り返す */
      justify-content: center;
      /* 中央揃え */
      gap: 10px;
      /* ボタン同士の間隔 */
      padding: 10px;
      background: #fbf8f3;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
      border: 1px solid #f0d8c0;
      background: white;
      border-radius: 999px;
      font-weight: bold;
      transition: 0.2s;
      box-shadow: 0 2px 5px rgba(230, 92, 0, 0.08);
      white-space: nowrap;
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #e65c00, 1px -1px 0 #e65c00,
        -1px 1px 0 #e65c00, -1px -1px 0 #e65c00,
        1px 0px 0 #e65c00, -1px 0px 0 #e65c00,
        0px 1px 0 #e65c00, 0px -1px 0 #e65c00;
    }

    button:hover {
      background: #fff3e6;
    }

    button.active {
      background: #d9381e;
      color: #fff3cc;
    }

    #menuTypeButtons button,
    .category-nav button {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      line-height: 1.15;
    }

    .tab-jp-label {
      color: #666;
      font-size: 0.78em;
      font-weight: 600;
      text-shadow: none;
    }

    button.active .tab-jp-label {
      color: #fff3cc;
    }

    .controls::-webkit-scrollbar,
    #menuTypeButtons::-webkit-scrollbar,
    .category-nav::-webkit-scrollbar {
      display: none;
    }

    /* ==========================================================================
       3. メニューアイテム・カクテル・写真の設定
       ========================================================================== */
    h2 {
      margin-top: 20px;
      border-left: 6px solid #557a2b;
      padding-left: 10px;
      font-size: 24px;
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #d9381e, 1px -1px 0 #d9381e,
        -1px 1px 0 #d9381e, -1px -1px 0 #d9381e,
        1px 0px 0 #d9381e, -1px 0px 0 #d9381e,
        0px 1px 0 #d9381e, 0px -1px 0 #d9381e;
    }

    /* 料理のカード（左写真・右テキスト） */
    .menu-item {
      background: white;
      margin-bottom: 12px;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(230, 92, 0, 0.04);
      border: 1px solid #fff3e6;
      display: flex;
      /* 横並び */
      align-items: center;
      gap: 14px;
      /* 写真と文字の間隔 */
    }

    /* メニュー写真 */
    .menu-item-img {
      width: 80px;
      height: 80px;
      min-width: 80px;
      border-radius: 8px;
      object-fit: cover;
      /* 切り抜き調整 */
      background-color: #eaeaea;
    }

    /* 画像がない場合のプレースホルダー */
    .no-image-placeholder {
      width: 80px;
      height: 80px;
      min-width: 80px;
      border-radius: 8px;
      background-color: #eaeaea;
      color: #888;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: normal;
      text-shadow: none;
    }

    /* 文字エリア */
    .menu-item-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .name {
      font-weight: bold;
      font-size: 18px;
      color: #3e2716;
      /* ハッキリ読めるように濃い茶色に変更 */
      text-shadow: none;
      /* フチ取りをオフにしてスッキリ読みやすく */
    }

    .price {
      font-size: 16px;
      font-weight: bold;
      color: #e65c00;
      /* 価格はアクセントとしてオレンジに */
      text-shadow: none;
      /* フチ取りをオフ */
    }

    /* カクテルセクション */
    .cocktail-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .cocktail-group {
      background: white;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(230, 92, 0, 0.04);
      border: 1px solid #fff3e6;
    }

    .cocktail-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 2px solid #e65c00;
      padding-bottom: 6px;
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #00b050, 1px -1px 0 #00b050,
        -1px 1px 0 #00b050, -1px -1px 0 #00b050,
        1px 0px 0 #00b050, -1px 0px 0 #00b050,
        0px 1px 0 #00b050, 0px -1px 0 #00b050;
    }

    .cocktail-item {
      padding: 6px 0;
      border-bottom: 1px solid #fff3e6;
      color: #fff3cc;
      text-shadow:
        1px 1px 0 #943b00, 1px -1px 0 #943b00,
        -1px 1px 0 #943b00, -1px -1px 0 #943b00,
        1px 0px 0 #943b00, -1px 0px 0 #943b00,
        0px 1px 0 #943b00, 0px -1px 0 #943b00;
    }

    .cocktail-detail {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: #666;
      font-size: 0.9em;
    }

    .cocktail-price {
      flex-shrink: 0;
      color: #e65c00;
      font-weight: bold;
    }

    .jp-name,
    .cocktail-jp-name {
      color: #666;
      text-shadow: none;
    }

    .jp-name {
      font-size: 0.8em;
    }

    .cocktail-jp-name {
      margin-top: 2px;
      font-size: 0.85em;
    }

    /* ==========================================================================
       4. スマホ版（画面幅 767px 以下）
       ========================================================================== */
    @media (max-width: 767px) {
      header {
        position: sticky;
        top: 0;
        z-index: 999;
      }

      .menu-navigation-stack {
        position: sticky;
        top: var(--mobile-header-height);
        z-index: 998;
        background: #fbf8f3;
        box-shadow: 0 2px 7px rgba(0, 0, 0, 0.1);
      }

      #menuTypeButtons {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 12px;
        background: white;
        position: static;
        box-shadow: none;
        justify-content: flex-start;
        scrollbar-width: none;
      }

      .category-nav {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 12px;
        background: #fff9f2;
        position: static;
        box-shadow: inset 0 1px 0 rgba(230, 92, 0, 0.08);
        justify-content: flex-start;
        scrollbar-width: none;
      }

      .category-block {
        scroll-margin-top: calc(var(--mobile-header-height) + var(--mobile-navigation-height) + 12px);
      }

      #menu {
        padding: 16px;
      }

      .menu-items-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      header {
        font-size: 24px;
      }

      h2 {
        font-size: 22px;
      }
    }

    /* ==========================================================================
       5. PC・タブレット版（画面幅 768px 以上）
       ========================================================================== */
    @media (min-width: 768px) {

      .controls,
      #menuTypeButtons,
      .category-nav {
        display: flex;
        flex-direction: row;
        /* PC版でも縦組みにせず、横並びを維持 */
        flex-wrap: wrap;
        justify-content: center;
        padding: 10px !important;
        width: 100%;
      }

      button {
        width: auto;
        min-width: 140px;
        margin: 4px;
        text-align: center;
      }

      #menu {
        padding: 24px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 30px;
      }

      /* 料理カードを2列に並べる */
      .menu-items-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }

      header {
        font-size: 32px;
        padding: 20px;
      }

      h2 {
        font-size: 26px;
        margin-top: 10px;
      }
    }
  </style>
</head>

    const menuTypeJapaneseLabels = {
      dinner: "ディナーメニュー",
      drink: "ドリンクメニュー",
      wine: "ワインメニュー",
      weekendLunch: "土日祝日ランチメニュー"
    };

    let currentLanguage = "en";
    let currentMenuType = "dinner";

    function setTabLabels(button, primaryLabel, japaneseLabel) {
      const primary = document.createElement("span");
      primary.className = "tab-primary-label";
      primary.textContent = primaryLabel;
      button.appendChild(primary);

      if (japaneseLabel) {
        const japanese = document.createElement("span");
        japanese.className = "tab-jp-label";
        japanese.textContent = japaneseLabel;
        button.appendChild(japanese);
      }
    }

    function updateStickyMeasurements() {
      const header = document.getElementById("title");
      const navigation = document.getElementById("menuNavigationStack");
      document.documentElement.style.setProperty("--mobile-header-height", `${header.offsetHeight}px`);
      document.documentElement.style.setProperty("--mobile-navigation-height", `${navigation.offsetHeight}px`);
    }

    function init() {
      createMenuTypeButtons();
      renderMenu();
      updateLanguageButtons();
      updateStickyMeasurements();
    }

    function createMenuTypeButtons() {
      const container = document.getElementById("menuTypeButtons");
      container.innerHTML = "";
      const types = data[currentLanguage].menuTypes;
      for (const key in types) {
        const btn = document.createElement("button");
        setTabLabels(btn, types[key].label, menuTypeJapaneseLabels[key]);
        if (key === currentMenuType) btn.classList.add("active");
        btn.onclick = () => {
          currentMenuType = key;
          const buttons = container.querySelectorAll("button");
          buttons.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          renderMenu();
          requestAnimationFrame(updateStickyMeasurements);
        };
        container.appendChild(btn);
      }
    }

    function createCategoryNav(categories) {
      const nav = document.getElementById("categoryButtons");
      nav.innerHTML = "";
      categories.forEach(cat => {
        const btn = document.createElement("button");
        setTabLabels(btn, cat.name, cat.jpName);
        btn.onclick = () => {
          const target = document.getElementById("cat-" + cat.name);
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        };
        nav.appendChild(btn);
      });
      requestAnimationFrame(updateStickyMeasurements);
    }

    function renderMenu() {
      const menuDiv = document.getElementById("menu");
      menuDiv.innerHTML = "";

      const menuTypeData = data[currentLanguage].menuTypes[currentMenuType];
      if (!menuTypeData) return;

      createCategoryNav(menuTypeData.categories);

      menuTypeData.categories.forEach(category => {
        const catBlock = document.createElement("div");
        catBlock.className = "category-block";
        catBlock.id = "cat-" + category.name;

        const h2 = document.createElement("h2");
        h2.textContent = category.name;
        catBlock.appendChild(h2);

        if (category.name.toLowerCase().includes("cocktail") || category.name.includes("Cócteles") || category.name.includes("鸡尾酒")) {
          const wrapper = document.createElement("div");
          wrapper.className = "cocktail-wrapper";
          let currentGroup = null;

          category.items.forEach(item => {
            if (!item.name.startsWith("-")) {
              currentGroup = document.createElement("div");
              currentGroup.className = "cocktail-group";
              const detailHtml = item.jpName || item.price
                ? `<div class="cocktail-detail">${item.jpName ? `<span class="cocktail-jp-name">${item.jpName}</span>` : ""}${item.price ? `<span class="cocktail-price">${item.price}</span>` : ""}</div>`
                : "";
              currentGroup.innerHTML = `<div class="cocktail-title">${item.name.replace(/\n/g, "<br>")}</div>${detailHtml}`;
              wrapper.appendChild(currentGroup);
            } else {
              const div = document.createElement("div");
              div.className = "cocktail-item";
              const jpName = item.jpName ? item.jpName.replace(/^-/, "") : "";
              div.innerHTML = `<div>${item.name.replace(/^-/, "").replace(/\n/g, "<br>")}</div>${jpName ? `<div class="cocktail-jp-name">${jpName.replace(/\n/g, "<br>")}</div>` : ""}`;
              if (currentGroup) currentGroup.appendChild(div);
            }
          });
          catBlock.appendChild(wrapper);
        } else {
          const itemsContainer = document.createElement("div");
          itemsContainer.className = "menu-items-container";

          category.items.forEach(item => {
            const div = document.createElement("div");
            div.className = "menu-item";

            // 画像の存在・空文字チェック
            const imageHtml = (item.image && item.image.trim() !== "")
              ? `<img src="${item.image}" alt="${item.name}" class="menu-item-img">`
              : `<div class="no-image-placeholder">No Image</div>`;

            div.innerHTML = `
              ${imageHtml}
              <div class="menu-item-info">
              <div class="name">
               <span>${item.name}</span>
                ${item.jpName ? `<div class="jp-name">${item.jpName}</div>` : ''}
              </div>
              <div class="price">${item.price}</div>
              </div>
            `;
            itemsContainer.appendChild(div);
          });
          catBlock.appendChild(itemsContainer);
        }
        menuDiv.appendChild(catBlock);
      });
    }

    function updateLanguageButtons() {
      const buttons = document.querySelectorAll("#languageButtons button");
      buttons.forEach(btn => btn.classList.remove("active"));
      buttons.forEach(btn => {
        if (
          (currentLanguage === "en" && btn.textContent === "English") ||
          (currentLanguage === "es" && btn.textContent === "Spanish") ||
          (currentLanguage === "zh" && btn.textContent === "中文")
        ) {
          btn.classList.add("active");
        }
      });
    }

    function setLanguage(lang) {
      currentLanguage = lang;
      document.getElementById("title").textContent = data[lang].title;
      document.getElementById("menuTypeLabel").textContent = data[lang].menuTypeLabel;
      createMenuTypeButtons();
      renderMenu();
      updateLanguageButtons();
      requestAnimationFrame(updateStickyMeasurements);
    }

    window.addEventListener("resize", updateStickyMeasurements);
    window.onload = init;
  </script>
